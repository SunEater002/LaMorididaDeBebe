<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin · Comentarios · La Mordida de Bebe</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/config.js"></script>
</head>
<body class="bg-gradient-to-br from-pink-200 via-yellow-200 to-pink-300 min-h-screen font-sans text-gray-800">
  <main class="max-w-3xl mx-auto px-4 py-10">
    <h1 class="text-3xl font-extrabold text-pink-700 text-center mb-6">Panel de comentarios 🐾</h1>

    <!-- Login -->
    <form id="login" class="bg-white rounded-xl shadow-lg p-6 space-y-4 max-w-md mx-auto">
      <h2 class="text-xl font-bold text-pink-700">Iniciar sesión</h2>
      <input id="email" type="email" required placeholder="Correo de administrador" autocomplete="username"
             class="w-full border-2 border-pink-200 focus:border-pink-500 outline-none rounded-lg px-3 py-2">
      <input id="password" type="password" required placeholder="Contraseña" autocomplete="current-password"
             class="w-full border-2 border-pink-200 focus:border-pink-500 outline-none rounded-lg px-3 py-2">
      <button class="w-full bg-pink-600 hover:bg-pink-700 text-white font-bold py-2 rounded-lg">Entrar</button>
      <button id="forgot-password" type="button" class="w-full text-pink-700 hover:underline">¿Olvidaste tu contraseña?</button>
      <p id="login-error" class="text-red-600 font-semibold text-center"></p>
    </form>

    <form id="reset-request" class="hidden bg-white rounded-xl shadow-lg p-6 space-y-4 max-w-md mx-auto">
      <h2 class="text-xl font-bold text-pink-700">Recuperar contraseña</h2>
      <p class="text-gray-600">Te enviaremos un enlace al correo de administrador.</p>
      <input id="reset-email" type="email" required placeholder="Correo de administrador" autocomplete="email"
             class="w-full border-2 border-pink-200 focus:border-pink-500 outline-none rounded-lg px-3 py-2">
      <button class="w-full bg-pink-600 hover:bg-pink-700 text-white font-bold py-2 rounded-lg">Enviar enlace</button>
      <button id="back-to-login" type="button" class="w-full text-pink-700 hover:underline">Volver a iniciar sesión</button>
      <p id="reset-request-message" class="font-semibold text-center" role="status"></p>
    </form>

    <form id="new-password" class="hidden bg-white rounded-xl shadow-lg p-6 space-y-4 max-w-md mx-auto">
      <h2 class="text-xl font-bold text-pink-700">Crear nueva contraseña</h2>
      <input id="new-password-value" type="password" required minlength="6" placeholder="Nueva contraseña" autocomplete="new-password"
             class="w-full border-2 border-pink-200 focus:border-pink-500 outline-none rounded-lg px-3 py-2">
      <input id="confirm-password" type="password" required minlength="6" placeholder="Confirma la contraseña" autocomplete="new-password"
             class="w-full border-2 border-pink-200 focus:border-pink-500 outline-none rounded-lg px-3 py-2">
      <button class="w-full bg-pink-600 hover:bg-pink-700 text-white font-bold py-2 rounded-lg">Guardar contraseña</button>
      <p id="new-password-message" class="font-semibold text-center" role="status"></p>
    </form>

    <!-- Panel -->
    <section id="panel" class="hidden">
      <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
        <div id="tabs" class="flex gap-2">
          <button data-f="pendiente" class="tab px-4 py-2 rounded-lg font-bold">Pendientes <span id="n-pendiente"></span></button>
          <button data-f="aprobado" class="tab px-4 py-2 rounded-lg font-bold">Aprobados <span id="n-aprobado"></span></button>
          <button data-f="todos" class="tab px-4 py-2 rounded-lg font-bold">Todos</button>
        </div>
        <button id="salir" class="bg-gray-700 hover:bg-gray-900 text-white px-4 py-2 rounded-lg font-semibold">Salir</button>
      </div>
      <div id="lista" class="space-y-4"></div>
    </section>
  </main>

  <script>
    const cfg = window.SUPABASE_CONFIG;
    const db = window.supabase.createClient(cfg.url, cfg.anonKey);
    const $ = (id) => document.getElementById(id);
    let filtro = 'pendiente';
    let enRecuperacion = new URLSearchParams(window.location.hash.slice(1)).get('type') === 'recovery';

    const estrellas = (n) => '★'.repeat(n) + '☆'.repeat(5 - n);

    function setTabs() {
      document.querySelectorAll('.tab').forEach((b) => {
        const activo = b.dataset.f === filtro;
        b.className = 'tab px-4 py-2 rounded-lg font-bold ' +
          (activo ? 'bg-pink-600 text-white' : 'bg-white text-pink-700 hover:bg-pink-100');
      });
    }

    async function cargar() {
      setTabs();
      const { data, error } = await db.from('comentarios').select('*').order('creado', { ascending: false });
      const lista = $('lista');
      lista.replaceChildren();

      if (error) {
        lista.textContent = 'Error al cargar. ¿Iniciaste sesión con el correo de administrador?';
        return;
      }

      $('n-pendiente').textContent = '(' + data.filter((c) => c.estado === 'pendiente').length + ')';
      $('n-aprobado').textContent = '(' + data.filter((c) => c.estado === 'aprobado').length + ')';

      const visibles = filtro === 'todos' ? data : data.filter((c) => c.estado === filtro);
      if (!visibles.length) {
        lista.textContent = 'No hay comentarios en esta sección.';
        return;
      }

      visibles.forEach((c) => {
        const card = document.createElement('article');
        card.className = 'bg-white rounded-xl shadow p-5 border-l-4 ' +
          (c.estado === 'aprobado' ? 'border-green-500' : 'border-yellow-500');

        const top = document.createElement('div');
        top.className = 'flex flex-wrap items-center justify-between gap-2';
        const nombre = document.createElement('strong');
        nombre.className = 'text-pink-700 text-lg';
        nombre.textContent = c.nombre;
        const stars = document.createElement('span');
        stars.className = 'text-yellow-500 text-xl';
        stars.textContent = estrellas(c.calificacion);
        top.append(nombre, stars);

        const meta = document.createElement('p');
        meta.className = 'text-sm text-gray-500 mb-2';
        meta.textContent = [
          c.platillo,
          new Date(c.creado).toLocaleString('es-MX'),
          c.estado === 'aprobado' ? '✅ Publicado' : '⏳ Pendiente'
        ].filter(Boolean).join(' · ');

        const texto = document.createElement('p');
        texto.className = 'text-gray-700 mb-4 whitespace-pre-wrap';
        texto.textContent = c.comentario;

        const resp = document.createElement('textarea');
        resp.className = 'w-full border-2 border-pink-200 focus:border-pink-500 outline-none rounded-lg px-3 py-2 mb-3';
        resp.rows = 2;
        resp.maxLength = 500;
        resp.placeholder = 'Tu respuesta pública (opcional)';
        resp.value = c.respuesta || '';

        const acciones = document.createElement('div');
        acciones.className = 'flex gap-2 flex-wrap';

        if (c.estado === 'pendiente') {
          acciones.append(boton('Aprobar', 'bg-green-600 hover:bg-green-700', () => cambiar(c.id, 'aprobado')));
        } else {
          acciones.append(boton('Ocultar', 'bg-yellow-600 hover:bg-yellow-700', () => cambiar(c.id, 'pendiente')));
        }
        acciones.append(boton('Guardar respuesta', 'bg-pink-600 hover:bg-pink-700', () => guardarRespuesta(c.id, resp.value)));
        acciones.append(boton('Eliminar', 'bg-red-600 hover:bg-red-700', () => eliminar(c.id)));

        card.append(top, meta, texto, resp, acciones);
        lista.append(card);
      });
    }

    function boton(txt, clases, fn) {
      const b = document.createElement('button');
      b.className = clases + ' text-white px-4 py-2 rounded-lg font-semibold';
      b.textContent = txt;
      b.addEventListener('click', fn);
      return b;
    }

    async function cambiar(id, estado) {
      const { error } = await db.from('comentarios').update({ estado }).eq('id', id);
      if (error) alert('No se pudo actualizar.');
      cargar();
    }

    async function guardarRespuesta(id, txt) {
      const { error } = await db.from('comentarios').update({ respuesta: txt.trim() || null }).eq('id', id);
      alert(error ? 'No se pudo guardar la respuesta.' : 'Respuesta guardada ✅');
      cargar();
    }

    async function eliminar(id) {
      if (!confirm('¿Eliminar este comentario definitivamente?')) return;
      const { error } = await db.from('comentarios').delete().eq('id', id);
      if (error) alert('No se pudo eliminar.');
      cargar();
    }

    function mostrarPanel(si) {
      $('login').classList.toggle('hidden', si || enRecuperacion);
      $('reset-request').classList.add('hidden');
      $('new-password').classList.toggle('hidden', !enRecuperacion);
      $('panel').classList.toggle('hidden', !si || enRecuperacion);
      if (si && !enRecuperacion) cargar();
    }

    $('forgot-password').addEventListener('click', () => {
      $('login').classList.add('hidden');
      $('reset-request').classList.remove('hidden');
      $('reset-email').value = $('email').value.trim();
      $('reset-request-message').textContent = '';
    });

    $('back-to-login').addEventListener('click', () => {
      $('reset-request').classList.add('hidden');
      $('login').classList.remove('hidden');
    });

    $('reset-request').addEventListener('submit', async (e) => {
      e.preventDefault();
      const { error } = await db.auth.resetPasswordForEmail($('reset-email').value.trim(), {
        redirectTo: window.location.origin + window.location.pathname
      });
      const message = $('reset-request-message');
      message.textContent = error
        ? 'No se pudo enviar el enlace. Verifica la configuración de recuperación e inténtalo de nuevo.'
        : 'Si el correo está registrado, recibirás un enlace para restablecer la contraseña.';
      message.className = 'font-semibold text-center ' + (error ? 'text-red-600' : 'text-green-700');
    });

    $('new-password').addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = $('new-password-message');
      const password = $('new-password-value').value;
      if (password !== $('confirm-password').value) {
        message.textContent = 'Las contraseñas no coinciden.';
        message.className = 'font-semibold text-center text-red-600';
        return;
      }

      const { error } = await db.auth.updateUser({ password });
      if (error) {
        message.textContent = 'No se pudo actualizar la contraseña. Solicita un nuevo enlace e inténtalo de nuevo.';
        message.className = 'font-semibold text-center text-red-600';
        return;
      }

      enRecuperacion = false;
      mostrarPanel(true);
    });

    db.auth.onAuthStateChange((event) => {
      if (event === 'PASSWORD_RECOVERY') {
        enRecuperacion = true;
        window.history.replaceState(null, '', window.location.pathname + window.location.search);
        mostrarPanel(false);
      }
    });

    $('login').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('login-error').textContent = '';
      const { error } = await db.auth.signInWithPassword({
        email: $('email').value.trim(),
        password: $('password').value
      });
      if (error) { $('login-error').textContent = 'Correo o contraseña incorrectos.'; return; }
      mostrarPanel(true);
    });

    $('salir').addEventListener('click', async () => { await db.auth.signOut(); mostrarPanel(false); });

    $('tabs').addEventListener('click', (e) => {
      const f = e.target.closest('.tab')?.dataset.f;
      if (f) { filtro = f; cargar(); }
    });

    db.auth.getSession().then(({ data, error }) => {
      if (error) {
        $('login-error').textContent = 'No se pudo verificar la sesión. Recarga la página e inténtalo de nuevo.';
        return;
      }
      if (!enRecuperacion) mostrarPanel(!!data.session);
    });
  </script>
</body>
</html>
